name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build every target and upload the bundles as run
  # artifacts WITHOUT creating a release, so the matrix can be tested
  # without cutting a version.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS ARM64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS Intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux x64
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            name: Linux ARM64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm install

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Must run AFTER the tests: the arm64 -dev packages are not
      # co-installable with their amd64 counterparts, so apt removes the
      # amd64 ones (libwebkit2gtk-4.1-dev, libsoup-3.0-dev, ...) and the
      # native test build would then fail to find them via pkg-config.
      - name: Install Linux ARM64 cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          # GitHub's ubuntu-22.04 runner sources.list uses mixed schemes
          # (mirror+file:, http:, https: for security.ubuntu.com) rather
          # than a uniform "deb http" prefix, so restrict by the deb/deb-src
          # keyword itself rather than assuming a URL scheme.
          sudo sed -i -E 's/^deb(-src)? /deb\1 [arch=amd64] /' /etc/apt/sources.list
          sudo tee /etc/apt/sources.list.d/arm64.list > /dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 \
            libappindicator3-dev:arm64 \
            librsvg2-dev:arm64

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '/usr/aarch64-linux-gnu' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CXX_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-g++' || '' }}
        with:
          # Empty on manual runs, which makes tauri-action build only and
          # skip creating a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('CitCat {0}', github.ref_name) || '' }}
          releaseBody: |
            Download CitCat for your platform:
            - **macOS ARM64** (Apple Silicon) — `.dmg`
            - **macOS Intel** — `.dmg`
            - **Windows** — `.msi` installer
            - **Linux x64** — `.deb` / `.AppImage`
            - **Linux ARM64** — `.deb` / `.rpm`
          releaseDraft: false
          prerelease: false
          # Linux ARM64 ships .deb and .rpm but no AppImage: the AppImage
          # bundler executes aarch64 tooling (linuxdeploy-aarch64) on the
          # x86_64 runner, which fails both natively ("Exec format error")
          # and under binfmt/QEMU ("failed to run linuxdeploy").
          args: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '--target aarch64-unknown-linux-gnu --bundles deb,rpm' || format('--target {0}', matrix.target) }}

      - name: Upload bundles as run artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: citcat-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: warn
