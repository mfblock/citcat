[package]
name = "citcat"
version = "0.1.0"
description = "A data-driven visual content engine"
authors = ["Mirjam Block"]
edition = "2021"

[lib]
name = "citcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "citcat"
path = "src/main.rs"

[[bin]]
name = "citcat-cli"
path = "src/cli.rs"

[[bin]]
name = "citcat-mcp"
path = "src/mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1.3"
postgres = "0.19"
clap = { version = "4", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
